<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="chunk-title chunk-desc">
  <title id="chunk-title">Chunked prefill eliminates inter-token latency spikes</title>
  <desc id="chunk-desc">A latency chart comparing unchunked prefill against chunked prefill. An unchunked prompt prefill halts decode streams for hundreds of milliseconds. Chunked prefill splits the prompt into small slices, keeping streaming latency smooth and predictable.</desc>

  <style>
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: 1px; fill: #6c7067; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #202522; }
    .cap { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #6c7067; }
    .decode-bar { fill: #56695e; }
    .spike-bar { fill: #a9412b; }
    .chunk-bar { fill: #a9412b; opacity: 0.85; }
    .axis { stroke: #d7d1c4; stroke-width: 1; }
    .grid { stroke: #e8e4da; stroke-width: 1; stroke-dasharray: 2 3; }
  </style>

  <!-- Panel A: Unchunked Prefill -->
  <text class="lbl" x="0" y="12">A · WITHOUT CHUNKING: MONOLITHIC PREFILL FREEZES DECODE</text>
  <line class="axis" x1="0" y1="20" x2="660" y2="20" />

  <g transform="translate(0, 10)">
    <!-- Reference grid & labels -->
    <text class="lbl" x="0" y="44">300ms</text>
    <line class="grid" x1="46" y1="40" x2="420" y2="40" />

    <text class="lbl" x="0" y="84">30ms</text>
    <line class="grid" x1="46" y1="80" x2="420" y2="80" />

    <line class="axis" x1="46" y1="105" x2="420" y2="105" />

    <!-- Decode bars (normal ~30ms) -->
    <rect class="decode-bar" x="65" y="80" width="22" height="25" rx="1" />
    <rect class="decode-bar" x="97" y="80" width="22" height="25" rx="1" />
    <rect class="decode-bar" x="129" y="80" width="22" height="25" rx="1" />

    <!-- 320ms Monolithic Prefill spike -->
    <rect class="spike-bar" x="163" y="38" width="80" height="67" rx="2" />
    <text class="mono" x="203" y="28" text-anchor="middle" fill="#a9412b" font-weight="600">320ms prefill</text>

    <!-- Resumed decode bars -->
    <rect class="decode-bar" x="255" y="80" width="22" height="25" rx="1" />
    <rect class="decode-bar" x="287" y="80" width="22" height="25" rx="1" />
    <rect class="decode-bar" x="319" y="80" width="22" height="25" rx="1" />

    <!-- Right-side explanation -->
    <text class="cap" x="440" y="44" fill="#a9412b" font-weight="600">10x latency spike</text>
    <text class="cap" x="440" y="62">Active decodes freeze while the GPU</text>
    <text class="cap" x="440" y="78">processes the whole 4,000-token prompt.</text>
    <text class="cap" x="440" y="94">Users see typing pause abruptly.</text>
  </g>

  <!-- Panel B: Chunked Prefill -->
  <g transform="translate(0, 142)">
    <text class="lbl" x="0" y="12">B · WITH CHUNKED PREFILL: SMOOTH, INTERLEAVED EXECUTION</text>
    <line class="axis" x1="0" y1="20" x2="660" y2="20" />

    <g transform="translate(0, 10)">
      <text class="lbl" x="0" y="44">300ms</text>
      <line class="grid" x1="46" y1="40" x2="420" y2="40" />

      <text class="lbl" x="0" y="84">30ms</text>
      <line class="grid" x1="46" y1="80" x2="420" y2="80" />

      <line class="axis" x1="46" y1="105" x2="420" y2="105" />

      <!-- Step 1 & 2: pure decode -->
      <rect class="decode-bar" x="65" y="80" width="22" height="25" rx="1" />
      <rect class="decode-bar" x="97" y="80" width="22" height="25" rx="1" />

      <!-- Interleaved chunks + decodes: ~42ms height -->
      <rect class="chunk-bar" x="129" y="70" width="26" height="35" rx="1" />
      <rect class="chunk-bar" x="161" y="70" width="26" height="35" rx="1" />
      <rect class="chunk-bar" x="193" y="70" width="26" height="35" rx="1" />
      <rect class="chunk-bar" x="225" y="70" width="26" height="35" rx="1" />
      <text class="mono" x="193" y="58" text-anchor="middle" fill="#a9412b">512-token chunks (~42ms)</text>

      <!-- Resumed pure decode -->
      <rect class="decode-bar" x="257" y="80" width="22" height="25" rx="1" />
      <rect class="decode-bar" x="289" y="80" width="22" height="25" rx="1" />
      <rect class="decode-bar" x="321" y="80" width="22" height="25" rx="1" />

      <!-- Right-side explanation -->
      <text class="cap" x="440" y="44" fill="#56695e" font-weight="600">Stable token streaming</text>
      <text class="cap" x="440" y="62">Prompt is sliced across iterations.</text>
      <text class="cap" x="440" y="78">Decode requests continue without pause.</text>
      <text class="cap" x="440" y="94">Typing cadence remains fluid and even.</text>
    </g>
  </g>

  <!-- Legend -->
  <line class="axis" x1="0" y1="272" x2="660" y2="272" />
  <rect class="decode-bar" x="0" y="280" width="12" height="12" rx="1" />
  <text class="cap" x="18" y="290">pure decode iteration</text>

  <rect class="chunk-bar" x="160" y="280" width="12" height="12" rx="1" />
  <text class="cap" x="178" y="290">prefill chunk interleaved with decodes</text>
</svg>
