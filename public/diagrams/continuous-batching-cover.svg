<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Continuous batching: iteration-level token scheduling</title>
  <desc id="cover-desc">An editorial cover: the letters C and B in a large serif typeface sit on warm paper beside a matrix of token execution slots across consecutive decode steps. Finished sequences yield immediately, admitting new requests without idle padding.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 5px; fill: #6C7067; }
    .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: #6C7067; }
    .step-header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #6C7067; text-anchor: middle; }
    .row-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #6C7067; text-anchor: end; }
    .cell-txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #FAF9F5; text-anchor: middle; font-weight: 600; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .slot-running { fill: #56695E; }
    .slot-admitted { fill: #A9412B; }
    .slot-empty { fill: none; stroke: #D7D1C4; stroke-width: 1; stroke-dasharray: 2 3; }
  </style>

  <rect width="1200" height="600" fill="#F3F0E7" />

  <!-- Top label -->
  <rect x="72" y="60" width="12" height="12" fill="#A9412B" />
  <text class="mono" x="98" y="74" font-size="22">ORCA / ITERATION SCHEDULING</text>
  <line x1="72" y1="104" x2="1128" y2="104" stroke="#D7D1C4" stroke-width="1" />

  <!-- Wordmark -->
  <text class="serif" x="64" y="370" font-size="270" letter-spacing="-12" fill="#202522">CB</text>
  <rect x="500" y="342" width="26" height="26" fill="#A9412B" />

  <text class="mono" x="74" y="428" font-size="22" letter-spacing="7">BATCHING</text>
  <line x1="74" y1="444" x2="380" y2="444" stroke="#D7D1C4" stroke-width="1" />

  <text class="serif" x="74" y="502" font-size="42" fill="#5F635B" font-style="italic">Tokens, not sequences.</text>

  <!-- Right-side token iteration matrix -->
  <g transform="translate(630, 0)">
    <!-- Column Step Headers -->
    <text class="step-header" x="25" y="146">T1</text>
    <text class="step-header" x="83" y="146">T2</text>
    <text class="step-header" x="141" y="146">T3</text>
    <text class="step-header" x="199" y="146">T4</text>
    <text class="step-header" x="257" y="146">T5</text>
    <text class="step-header" x="315" y="146">T6</text>
    <text class="step-header" x="373" y="146">T7</text>
    <text class="step-header" x="431" y="146">T8</text>

    <line x1="0" y1="158" x2="456" y2="158" stroke="#D7D1C4" stroke-width="1" />

    <!-- Row 1: Seq A (Runs T1..T8) -->
    <text class="row-id" x="-16" y="194">S1</text>
    <rect class="slot-running" x="0" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="25" y="193">A</text>
    <rect class="slot-running" x="58" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="83" y="193">A</text>
    <rect class="slot-running" x="116" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="141" y="193">A</text>
    <rect class="slot-running" x="174" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="199" y="193">A</text>
    <rect class="slot-running" x="232" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="257" y="193">A</text>
    <rect class="slot-running" x="290" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="315" y="193">A</text>
    <rect class="slot-running" x="348" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="373" y="193">A</text>
    <rect class="slot-running" x="406" y="172" width="50" height="34" rx="2" />
    <text class="cell-txt" x="431" y="193">A</text>

    <!-- Row 2: Seq B (T1..T3), then Seq E admitted at T4 -->
    <text class="row-id" x="-16" y="244">S2</text>
    <rect class="slot-running" x="0" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="25" y="243">B</text>
    <rect class="slot-running" x="58" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="83" y="243">B</text>
    <rect class="slot-running" x="116" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="141" y="243">B</text>
    <!-- Seq E joins immediately at T4 -->
    <rect class="slot-admitted" x="174" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="199" y="243">E</text>
    <rect class="slot-admitted" x="232" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="257" y="243">E</text>
    <rect class="slot-admitted" x="290" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="315" y="243">E</text>
    <rect class="slot-admitted" x="348" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="373" y="243">E</text>
    <rect class="slot-admitted" x="406" y="222" width="50" height="34" rx="2" />
    <text class="cell-txt" x="431" y="243">E</text>

    <!-- Row 3: Seq C (T1 only), then Seq F joins at T2..T6, Seq H at T7 -->
    <text class="row-id" x="-16" y="294">S3</text>
    <rect class="slot-running" x="0" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="25" y="293">C</text>
    <!-- Seq F joins at T2 -->
    <rect class="slot-admitted" x="58" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="83" y="293">F</text>
    <rect class="slot-admitted" x="116" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="141" y="293">F</text>
    <rect class="slot-admitted" x="174" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="199" y="293">F</text>
    <rect class="slot-admitted" x="232" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="257" y="293">F</text>
    <rect class="slot-admitted" x="290" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="315" y="293">F</text>
    <!-- Seq H joins at T7 -->
    <rect class="slot-admitted" x="348" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="373" y="293">H</text>
    <rect class="slot-admitted" x="406" y="272" width="50" height="34" rx="2" />
    <text class="cell-txt" x="431" y="293">H</text>

    <!-- Row 4: Seq D (T1..T5), then Seq G joins at T6 -->
    <text class="row-id" x="-16" y="344">S4</text>
    <rect class="slot-running" x="0" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="25" y="343">D</text>
    <rect class="slot-running" x="58" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="83" y="343">D</text>
    <rect class="slot-running" x="116" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="141" y="343">D</text>
    <rect class="slot-running" x="174" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="199" y="343">D</text>
    <rect class="slot-running" x="232" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="257" y="343">D</text>
    <!-- Seq G joins at T6 -->
    <rect class="slot-admitted" x="290" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="315" y="343">G</text>
    <rect class="slot-admitted" x="348" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="373" y="343">G</text>
    <rect class="slot-admitted" x="406" y="322" width="50" height="34" rx="2" />
    <text class="cell-txt" x="431" y="343">G</text>

    <!-- Legend -->
    <line x1="0" y1="390" x2="456" y2="390" stroke="#D7D1C4" stroke-width="1" />

    <rect class="slot-running" x="0" y="412" width="16" height="16" rx="2" />
    <text class="mono-sm" x="26" y="425" font-size="12">ACTIVE DECODE</text>

    <rect class="slot-admitted" x="200" y="412" width="16" height="16" rx="2" />
    <text class="mono-sm" x="226" y="425" font-size="12">DYNAMIC ADMISSION</text>
  </g>

  <line x1="630" y1="500" x2="1086" y2="500" stroke="#D7D1C4" stroke-width="1" />
  <text class="mono" x="630" y="532" font-size="17" letter-spacing="3">TOKEN ITERATION · ZERO IDLE PADDING</text>
</svg>
