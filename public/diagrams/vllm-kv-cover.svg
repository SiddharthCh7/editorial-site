<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">KV cache, paged into blocks scattered across GPU memory</title>
  <desc id="cover-desc">An editorial cover: the letters K and V in a large serif face sit on warm paper beside a grid of memory blocks. A handful of the blocks are filled and connected by a thin line that jumps between non-adjacent cells, suggesting logical order mapped onto scattered physical memory.</desc>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 5px; fill: #6C7067; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .cell { fill: none; stroke: #D7D1C4; stroke-width: 1; }
    .used { fill: #56695E; stroke: #56695E; }
    .hot { fill: #A9412B; stroke: #A9412B; }
    .thread { fill: none; stroke: #56695E; stroke-width: 1; stroke-dasharray: 2 5; opacity: 0.75; }
  </style>

  <rect width="1200" height="600" fill="#F3F0E7" />

  <!-- Top label -->
  <rect x="72" y="60" width="12" height="12" fill="#A9412B" />
  <text class="mono" x="98" y="74" font-size="22">vLLM / PAGED ATTENTION</text>
  <line x1="72" y1="104" x2="1128" y2="104" stroke="#D7D1C4" stroke-width="1" />

  <!-- Wordmark -->
  <text class="serif" x="64" y="370" font-size="270" letter-spacing="-12" fill="#202522">KV</text>
  <rect x="436" y="342" width="26" height="26" fill="#A9412B" />

  <text class="mono" x="74" y="428" font-size="22" letter-spacing="7">CACHE</text>
  <line x1="74" y1="444" x2="380" y2="444" stroke="#D7D1C4" stroke-width="1" />

  <text class="serif" x="74" y="502" font-size="42" fill="#5F635B" font-style="italic">Blocks, not buffers.</text>


