<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="analogy-title analogy-desc">
  <title id="analogy-title">Request-level static batching compared with iteration-level continuous batching</title>
  <desc id="analogy-desc">Comparing request-level batching where finished requests lock GPU slots with empty padding against iteration-level continuous batching where new requests enter on the next token step.</desc>

  <style>
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: 1px; fill: #6c7067; font-weight: 600; }
    .step-lbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.5px; fill: #8d9087; text-anchor: middle; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #202522; }
    .tok-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #faf9f5; text-anchor: middle; }
    .pad-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8.5px; fill: #a5a89f; text-anchor: middle; }
    .cap { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5f635b; }
    .slot-a { fill: #56695e; }
    .slot-b { fill: #202522; }
    .slot-c { fill: #a9412b; }
    .slot-pad { fill: none; stroke: #d7d1c4; stroke-width: 1; stroke-dasharray: 2 3; }
    .axis { stroke: #d7d1c4; stroke-width: 1; }
  </style>

  <!-- Panel A: Static Request-Level Batching -->
  <text class="lbl" x="0" y="12">A · STATIC BATCHING: LOCKED CONTAINER</text>
  <line class="axis" x1="0" y1="20" x2="660" y2="20" />

  <!-- Step Column Headers -->
  <text class="step-lbl" x="90" y="34">STEP 1</text>
  <text class="step-lbl" x="140" y="34">STEP 2</text>
  <text class="step-lbl" x="190" y="34">STEP 3</text>
  <text class="step-lbl" x="240" y="34">STEP 4</text>
  <text class="step-lbl" x="290" y="34">STEP 5</text>
  <text class="step-lbl" x="340" y="34">STEP 6</text>

  <!-- Row 1: Req A -->
  <text class="mono" x="0" y="56">REQ A</text>
  <rect class="slot-a" x="68" y="42" width="44" height="20" rx="2" />
  <text class="tok-text" x="90" y="55">A1</text>

  <rect class="slot-pad" x="118" y="42" width="44" height="20" rx="2" />
  <text class="pad-text" x="140" y="55">pad</text>
  <rect class="slot-pad" x="168" y="42" width="44" height="20" rx="2" />
  <text class="pad-text" x="190" y="55">pad</text>
  <rect class="slot-pad" x="218" y="42" width="44" height="20" rx="2" />
  <text class="pad-text" x="240" y="55">pad</text>
  <rect class="slot-pad" x="268" y="42" width="44" height="20" rx="2" />
  <text class="pad-text" x="290" y="55">pad</text>
  <rect class="slot-pad" x="318" y="42" width="44" height="20" rx="2" />
  <text class="pad-text" x="340" y="55">pad</text>

  <text class="cap" x="375" y="56" fill="#a9412b">Done at step 1 · slot locked with padding</text>

  <!-- Row 2: Req B -->
  <text class="mono" x="0" y="84">REQ B</text>
  <rect class="slot-b" x="68" y="70" width="44" height="20" rx="2" />
  <text class="tok-text" x="90" y="83">B1</text>
  <rect class="slot-b" x="118" y="70" width="44" height="20" rx="2" />
  <text class="tok-text" x="140" y="83">B2</text>
  <rect class="slot-b" x="168" y="70" width="44" height="20" rx="2" />
  <text class="tok-text" x="190" y="83">B3</text>
  <rect class="slot-b" x="218" y="70" width="44" height="20" rx="2" />
  <text class="tok-text" x="240" y="83">B4</text>
  <rect class="slot-b" x="268" y="70" width="44" height="20" rx="2" />
  <text class="tok-text" x="290" y="83">B5</text>
  <rect class="slot-b" x="318" y="70" width="44" height="20" rx="2" />
  <text class="tok-text" x="340" y="83">B6</text>

  <text class="cap" x="375" y="84">Runs to step 6 · forces Req A slot to sit idle</text>

  <!-- Static Queue Note -->
  <text class="lbl" x="68" y="108" fill="#a9412b">BLOCKED QUEUE:</text>
  <text class="cap" x="168" y="108">Req C waits outside despite 5 empty GPU slots</text>

  <!-- Panel B: Continuous Batching -->
  <text class="lbl" x="0" y="142">B · CONTINUOUS BATCHING: ITERATION-LEVEL ADMISSION</text>
  <line class="axis" x1="0" y1="150" x2="660" y2="150" />

  <text class="step-lbl" x="90" y="164">STEP 1</text>
  <text class="step-lbl" x="140" y="164">STEP 2</text>
  <text class="step-lbl" x="190" y="164">STEP 3</text>
  <text class="step-lbl" x="240" y="164">STEP 4</text>
  <text class="step-lbl" x="290" y="164">STEP 5</text>
  <text class="step-lbl" x="340" y="164">STEP 6</text>

  <!-- Row 1: Slot 1 with Dynamic Admission -->
  <text class="mono" x="0" y="186">SLOT 1</text>
  <!-- Req A at step 1 -->
  <rect class="slot-a" x="68" y="172" width="44" height="20" rx="2" />
  <text class="tok-text" x="90" y="185">A1</text>

  <!-- Req C admitted immediately at step 2 -->
  <rect class="slot-c" x="118" y="172" width="44" height="20" rx="2" />
  <text class="tok-text" x="140" y="185">C1</text>
  <rect class="slot-c" x="168" y="172" width="44" height="20" rx="2" />
  <text class="tok-text" x="190" y="185">C2</text>
  <rect class="slot-c" x="218" y="172" width="44" height="20" rx="2" />
  <text class="tok-text" x="240" y="185">C3</text>
  <rect class="slot-c" x="268" y="172" width="44" height="20" rx="2" />
  <text class="tok-text" x="290" y="185">C4</text>
  <rect class="slot-c" x="318" y="172" width="44" height="20" rx="2" />
  <text class="tok-text" x="340" y="185">C5</text>

  <text class="cap" x="375" y="186" fill="#a9412b" font-weight="600">Req A departs · Req C admitted at step 2</text>

  <!-- Row 2: Slot 2 with Ongoing Decode -->
  <text class="mono" x="0" y="214">SLOT 2</text>
  <rect class="slot-b" x="68" y="200" width="44" height="20" rx="2" />
  <text class="tok-text" x="90" y="213">B1</text>
  <rect class="slot-b" x="118" y="200" width="44" height="20" rx="2" />
  <text class="tok-text" x="140" y="213">B2</text>
  <rect class="slot-b" x="168" y="200" width="44" height="20" rx="2" />
  <text class="tok-text" x="190" y="213">B3</text>
  <rect class="slot-b" x="218" y="200" width="44" height="20" rx="2" />
  <text class="tok-text" x="240" y="213">B4</text>
  <rect class="slot-b" x="268" y="200" width="44" height="20" rx="2" />
  <text class="tok-text" x="290" y="213">B5</text>
  <rect class="slot-b" x="318" y="200" width="44" height="20" rx="2" />
  <text class="tok-text" x="340" y="213">B6</text>

  <text class="cap" x="375" y="214">Req B decodes without interruption</text>

  <!-- Continuous Queue Note -->
  <text class="lbl" x="68" y="238" fill="#56695e">STREAMING QUEUE:</text>
  <text class="cap" x="178" y="238">Req D queued to enter the instant Req B or C yields</text>

  <!-- Legend -->
  <line class="axis" x1="0" y1="256" x2="660" y2="256" />
  <rect class="slot-a" x="0" y="268" width="12" height="12" rx="1" />
  <text class="cap" x="18" y="278">request A</text>

  <rect class="slot-b" x="85" y="268" width="12" height="12" rx="1" />
  <text class="cap" x="103" y="278">request B</text>

  <rect class="slot-c" x="170" y="268" width="12" height="12" rx="1" />
  <text class="cap" x="188" y="278">newly admitted request C</text>

  <rect class="slot-pad" x="350" y="268" width="12" height="12" rx="1" />
  <text class="cap" x="368" y="278">idle padding (wasted compute)</text>
</svg>
